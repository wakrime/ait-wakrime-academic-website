name: Sync Google Scholar

on:
  workflow_dispatch:

  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize Google Scholar
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SCHOLAR_ID: r0OoVlQAAAAJ
        run: node scripts/sync-scholar.mjs

      - name: Commit updated Scholar data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/scholar.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Google Scholar publications"
            git push
          fi